<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porositë</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#17202a;
  --muted:#667085;
  --line:#e4e7ec;
  --primary:#2563eb;
  --success:#16a34a;
  --warning:#d97706;
  --danger:#dc2626;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

header{
  background:#17202a;
  color:white;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 10px #0002;
}

.head{
  max-width:1150px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

h1{
  margin:0;
  font-size:24px;
}

.subtitle{
  color:#cbd5e1;
  font-size:13px;
  margin-top:4px;
}

main{
  max-width:1150px;
  margin:auto;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  box-shadow:0 2px 8px #00000008;
}

.stat{
  font-size:28px;
  font-weight:700;
  margin-top:5px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

section{
  margin-top:18px;
}

section h2{
  font-size:19px;
  margin:0 0 12px;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700;
}

.primary{
  background:var(--primary);
  color:white;
}

.success{
  background:var(--success);
  color:white;
}

.warning{
  background:var(--warning);
  color:white;
}

.danger{
  background:var(--danger);
  color:white;
}

.light{
  background:#eef2f7;
  color:var(--text);
}

.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  font-weight:700;
}

input,
select,
textarea{
  width:100%;
  margin-top:6px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:9px;
  font:inherit;
  background:white;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.search{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:15px;
}

.supplier-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.supplier{
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  background:#fff;
}

.supplier-name{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.badge.waiting{
  background:#fff7ed;
  color:#c2410c;
}

.badge.arrived{
  background:#ecfdf3;
  color:#15803d;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,
td{
  text-align:left;
  padding:11px 8px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}

th{
  font-size:12px;
  color:var(--muted);
}

.status{
  font-size:13px;
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
}

.status.ok{
  background:#ecfdf3;
  color:#166534;
}

.status.error{
  background:#fef2f2;
  color:#991b1b;
}

.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.order-title{
  font-weight:700;
}

.small{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .supplier-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .head{
    padding:13px 14px;
  }

  main{
    padding:14px;
  }

  h1{
    font-size:20px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }

  .card{
    padding:12px;
  }

  .stat{
    font-size:22px;
  }

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  table{
    font-size:13px;
  }

  th:nth-child(4),
  td:nth-child(4){
    display:none;
  }

  .actions button{
    flex:1;
  }
}
</style>
</head>

<body>

<header>
  <div class="head">
    <div>
      <h1>📦 Porositë</h1>
      <div class="subtitle">Menaxhimi i porosive dhe furnitorëve</div>
    </div>

    <button class="light" onclick="loadAll()">↻ Rifresko</button>
  </div>
</header>

<main>

  <div id="message"></div>

  <!-- STATISTIKAT -->
  <div class="grid">

    <div class="card">
      <div class="muted">Porosi në pritje</div>
      <div class="stat" id="waitingCount">0</div>
    </div>

    <div class="card">
      <div class="muted">Porosi të ardhura</div>
      <div class="stat" id="arrivedCount">0</div>
    </div>

    <div class="card">
      <div class="muted">Gjithsej porosi</div>
      <div class="stat" id="totalCount">0</div>
    </div>

    <div class="card">
      <div class="muted">Furnitorë</div>
      <div class="stat" id="supplierCount">0</div>
    </div>

  </div>


  <!-- SHTO POROSI -->
  <section class="card">

    <h2>➕ Shto porosi të re</h2>

    <div class="form">

      <div>
        <label>Furnitori</label>
        <select id="supplier">
          <option value="">Zgjidh furnitorin...</option>
        </select>
      </div>

      <div>
        <label>Produkti</label>
        <select id="product">
          <option value="">Zgjidh produktin...</option>
        </select>
      </div>

      <div>
        <label>Sasia</label>
        <input id="quantity" type="text" placeholder="p.sh. 5">
      </div>

      <div>
        <label>Njësia</label>
        <input id="unit" type="text" placeholder="cope, pako, metra...">
      </div>

      <div class="full">
        <label>Specifikimi</label>
        <input id="specification" type="text"
               placeholder="p.sh. 50 cm, zi, 70 cm lartësi...">
      </div>

      <div class="full">
        <label>Shënim</label>
        <textarea id="note"
          placeholder="Shënime shtesë për porosinë..."></textarea>
      </div>

      <div class="full actions">
        <button class="primary" onclick="addOrder()">
          + Ruaj porosinë
        </button>

        <button class="light" onclick="clearForm()">
          Pastro
        </button>
      </div>

    </div>

  </section>


  <!-- KERKIM -->
  <section class="card">

    <h2>🔎 Kërko porosi</h2>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Kërko sipas furnitorit, produktit ose specifikimit..."
      oninput="renderOrders()"
    >

    <div class="actions" style="margin-top:12px">

      <button class="light" onclick="setFilter('all')">
        Të gjitha
      </button>

      <button class="warning" onclick="setFilter('waiting')">
        Në pritje
      </button>

      <button class="success" onclick="setFilter('arrived')">
        Të ardhura
      </button>

    </div>

  </section>


  <!-- FURNITORËT -->
  <section>

    <h2>🏢 Furnitorët</h2>

    <div id="suppliersList" class="supplier-grid">
      <div class="card empty">Duke ngarkuar...</div>
    </div>

  </section>


  <!-- POROSITE -->
  <section class="card">

    <h2>📋 Lista e porosive</h2>

    <div style="overflow-x:auto">

      <table>

        <thead>
          <tr>
            <th>Furnitori</th>
            <th>Produkti</th>
            <th>Sasia</th>
            <th>Specifikimi</th>
            <th>Data</th>
            <th>Statusi</th>
            <th>Veprime</th>
          </tr>
        </thead>

        <tbody id="ordersTable">
          <tr>
            <td colspan="7" class="empty">
              Duke ngarkuar...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </section>

</main>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://sfddbealvlrlvqawfcem.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_uSRoEKBFo1Q9zJptUpO9Ww_oiYZE9Cr";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let suppliers = [];
let products = [];
let orders = [];

let currentFilter = "all";


/* =========================================================
   MESAZHET
========================================================= */

function showMessage(text, type = "ok") {

  const box = document.getElementById("message");

  box.innerHTML = `
    <div class="status ${type}">
      ${escapeHtml(text)}
    </div>
  `;

  setTimeout(() => {
    box.innerHTML = "";
  }, 4000);
}


/* =========================================================
   SECURITY / HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   DATA
========================================================= */

async function loadSuppliers() {

  const { data, error } =
    await supabaseClient
      .from("suppliers")
      .select("*")
      .order("name");

  if (error) {
    throw error;
  }

  suppliers = data || [];

  renderSupplierSelect();
  renderSuppliers();
}


async function loadProducts() {

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("name");

  if (error) {
    throw error;
  }

  products = data || [];

  renderProductSelect();
}


async function loadOrders() {

  const { data, error } =
    await supabaseClient
      .from("orders")
      .select(`
        id,
        supplier_id,
        product_id,
        product_name,
        quantity,
        unit,
        specification,
        note,
        order_date,
        status,
        arrived_date,
        created_at,
        suppliers(name)
      `)
      .order("created_at", { ascending:false });

  if (error) {
    throw error;
  }

  orders = data || [];

  renderOrders();
  renderStats();
}


/* =========================================================
   LOAD ALL
========================================================= */

async function loadAll() {

  try {

    showMessage("Duke ngarkuar të dhënat...");

    await loadSuppliers();
    await loadProducts();
    await loadOrders();

    showMessage("Të dhënat u ngarkuan me sukses.");

  } catch (error) {

    console.error(error);

    showMessage(
      "Gabim gjatë lidhjes me databazën: " +
      error.message,
      "error"
    );
  }
}


/* =========================================================
   SUPPLIER SELECT
========================================================= */

function renderSupplierSelect() {

  const select =
    document.getElementById("supplier");

  select.innerHTML =
    `<option value="">Zgjidh furnitorin...</option>`;

  suppliers.forEach(supplier => {

    select.innerHTML += `
      <option value="${supplier.id}">
        ${escapeHtml(supplier.name)}
      </option>
    `;

  });

}


/* =========================================================
   PRODUCT SELECT
========================================================= */

function renderProductSelect() {

  const select =
    document.getElementById("product");

  select.innerHTML =
    `<option value="">Zgjidh produktin...</option>`;

  products.forEach(product => {

    select.innerHTML += `
      <option value="${product.id}">
        ${escapeHtml(product.name)}
      </option>
    `;

  });

}


/* =========================================================
   FURNITORET
========================================================= */

function renderSuppliers() {

  const container =
    document.getElementById("suppliersList");

  if (!suppliers.length) {

    container.innerHTML =
      `<div class="card empty">
        Nuk ka furnitorë.
      </div>`;

    return;
  }

  container.innerHTML = "";

  suppliers.forEach(supplier => {

    const supplierOrders =
      orders.filter(
        order => order.supplier_id === supplier.id
      );

    const waiting =
      supplierOrders.filter(
        order => order.status === "waiting"
      ).length;

    const arrived =
      supplierOrders.filter(
        order => order.status === "arrived"
      ).length;

    container.innerHTML += `

      <div class="supplier">

        <div class="supplier-name">

          <span>
            🏢 ${escapeHtml(supplier.name)}
          </span>

          <span class="badge waiting">
            ${waiting} në pritje
          </span>

        </div>

        <div class="small">
          ${supplierOrders.length} porosi gjithsej
          · ${arrived} të ardhura
        </div>

      </div>

    `;

  });

}


/* =========================================================
   STATISTIKAT
========================================================= */

function renderStats() {

  const waiting =
    orders.filter(
      order => order.status === "waiting"
    ).length;

  const arrived =
    orders.filter(
      order => order.status === "arrived"
    ).length;

  document.getElementById("waitingCount").textContent =
    waiting;

  document.getElementById("arrivedCount").textContent =
    arrived;

  document.getElementById("totalCount").textContent =
    orders.length;

  document.getElementById("supplierCount").textContent =
    suppliers.length;
}


/* =========================================================
   FILTER
========================================================= */

function setFilter(filter) {

  currentFilter = filter;

  renderOrders();
}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders() {

  const tbody =
    document.getElementById("ordersTable");

  const search =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();

  let filtered = [...orders];


  if (currentFilter !== "all") {

    filtered =
      filtered.filter(
        order =>
          order.status === currentFilter
      );

  }


  if (search) {

    filtered =
      filtered.filter(order => {

        const supplier =
          order.suppliers?.name || "";

        const text = [

          supplier,
          order.product_name,
          order.specification,
          order.note,
          order.quantity,
          order.unit

        ]
        .join(" ")
        .toLowerCase();

        return text.includes(search);

      });

  }


  if (!filtered.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Nuk u gjet asnjë porosi.
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML = "";


  filtered.forEach(order => {

    const supplier =
      order.suppliers?.name || "—";

    const date =
      order.order_date
        ? new Date(order.order_date)
            .toLocaleDateString("sq-AL")
        : "—";


    const statusHtml =
      order.status === "waiting"

        ? `<span class="badge waiting">
             ⏳ Në pritje
           </span>`

        : `<span class="badge arrived">
             ✅ E ardhur
           </span>`;


    let actionHtml = "";

    if (order.status === "waiting") {

      actionHtml = `
        <button
          class="success"
          onclick="markArrived('${order.id}')">
          Erdhi
        </button>
      `;

    } else {

      actionHtml = `
        <button
          class="light"
          onclick="markWaiting('${order.id}')">
          Kthe në pritje
        </button>
      `;

    }


    actionHtml += `
      <button
        class="danger"
        style="margin-left:5px"
        onclick="deleteOrder('${order.id}')">
        Fshi
      </button>
    `;


    tbody.innerHTML += `

      <tr>

        <td>
          <div class="order-title">
            ${escapeHtml(supplier)}
          </div>
        </td>

        <td>

          <div class="order-title">
            ${escapeHtml(order.product_name)}
          </div>

          ${
            order.note
              ? `<div class="small">
                   ${escapeHtml(order.note)}
                 </div>`
              : ""
          }

        </td>

        <td>
          ${escapeHtml(order.quantity || "—")}
          ${escapeHtml(order.unit || "")}
        </td>

        <td>
          ${escapeHtml(order.specification || "—")}
        </td>

        <td>
          ${date}
        </td>

        <td>
          ${statusHtml}
        </td>

        <td>
          <div class="actions">
            ${actionHtml}
          </div>
        </td>

      </tr>

    `;

  });

}


/* =========================================================
   ADD ORDER
========================================================= */

async function addOrder() {

  const supplierId =
    document.getElementById("supplier").value;

  const productId =
    document.getElementById("product").value;

  const quantity =
    document.getElementById("quantity").value.trim();

  const unit =
    document.getElementById("unit").value.trim();

  const specification =
    document.getElementById("specification").value.trim();

  const note =
    document.getElementById("note").value.trim();


  if (!supplierId) {

    showMessage(
      "Zgjidh furnitorin.",
      "error"
    );

    return;
  }


  if (!productId) {

    showMessage(
      "Zgjidh produktin.",
      "error"
    );

    return;
  }


  const product =
    products.find(
      p => String(p.id) === String(productId)
    );


  if (!product) {

    showMessage(
      "Produkti nuk u gjet.",
      "error"
    );

    return;
  }


  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  const { error } =
    await supabaseClient
      .from("orders")
      .insert({

        supplier_id: supplierId,

        product_id: productId,

        product_name: product.name,

        quantity: quantity || null,

        unit: unit || null,

        specification:
          specification || null,

        note:
          note || null,

        order_date: today,

        status: "waiting"

      });


  if (error) {

    console.error(error);

    showMessage(
      "Porosia nuk u ruajt: " +
      error.message,
      "error"
    );

    return;
  }


  clearForm();

  await loadOrders();

  renderSuppliers();

  showMessage(
    "✅ Porosia u ruajt me sukses."
  );

}


/* =========================================================
   MARK ARRIVED
========================================================= */

async function markArrived(id) {

  const { error } =
    await supabaseClient
      .from("orders")
      .update({

        status: "arrived",

        arrived_date:
          new Date().toISOString()

      })
      .eq("id", id);


  if (error) {

    showMessage(
      "Gabim: " + error.message,
      "error"
    );

    return;
  }


  await loadOrders();

  renderSuppliers();

  showMessage(
    "✅ Porosia u shënua si e ardhur."
  );

}


/* =========================================================
   MARK WAITING
========================================================= */

async function markWaiting(id) {

  const { error } =
    await supabaseClient
      .from("orders")
      .update({

        status: "waiting",

        arrived_date: null

      })
      .eq("id", id);


  if (error) {

    showMessage(
      "Gabim: " + error.message,
      "error"
    );

    return;
  }


  await loadOrders();

  renderSuppliers();

  showMessage(
    "Porosia u kthye në pritje."
  );

}


/* =========================================================
   DELETE ORDER
========================================================= */

async function deleteOrder(id) {

  const confirmed =
    confirm(
      "A je i sigurt që dëshiron ta fshish këtë porosi?"
    );

  if (!confirmed) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("orders")
      .delete()
      .eq("id", id);


  if (error) {

    showMessage(
      "Porosia nuk u fshi: " +
      error.message,
      "error"
    );

    return;
  }


  await loadOrders();

  renderSuppliers();

  showMessage(
    "Porosia u fshi."
  );

}


/* =========================================================
   CLEAR FORM
========================================================= */

function clearForm() {

  document.getElementById("supplier").value = "";

  document.getElementById("product").value = "";

  document.getElementById("quantity").value = "";

  document.getElementById("unit").value = "";

  document.getElementById("specification").value = "";

  document.getElementById("note").value = "";

}


/* =========================================================
   PRODUCT BY SUPPLIER
========================================================= */

document
  .getElementById("supplier")
  .addEventListener("change", function() {

    const supplierId = this.value;

    const select =
      document.getElementById("product");

    select.innerHTML =
      `<option value="">Zgjidh produktin...</option>`;


    let list = products;


    if (supplierId) {

      list =
        products.filter(
          product =>
            String(product.supplier_id) ===
            String(supplierId)
        );

    }


    list.forEach(product => {

      select.innerHTML += `
        <option value="${product.id}">
          ${escapeHtml(product.name)}
        </option>
      `;

    });

  });


/* =========================================================
   START
========================================================= */

loadAll();

</script>

</body>
</html>
