<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Porositë</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#17202a;
  --muted:#667085;
  --border:#e4e7ec;
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#d97706;
  --shadow:0 4px 18px rgba(0,0,0,.06);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* =========================
   LOGIN
========================= */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:var(--shadow);
}

.login-box h1{
  margin:0 0 8px;
  text-align:center;
}

.login-box p{
  color:var(--muted);
  text-align:center;
  margin-bottom:25px;
}

.login-box input{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:12px;
  outline:none;
}

.login-box input:focus{
  border-color:var(--primary);
}

.login-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:5px;
}

.login-buttons button{
  padding:12px;
  border:0;
  border-radius:10px;
  color:white;
  background:var(--primary);
}

.login-buttons button:last-child{
  background:#475467;
}

.login-message{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  background:#fef3c7;
  color:#92400e;
  display:none;
}

/* =========================
   HEADER
========================= */

header{
  background:#17202a;
  color:white;
  position:sticky;
  top:0;
  z-index:20;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.header-title{
  font-size:22px;
  font-weight:bold;
}

.header-subtitle{
  font-size:13px;
  color:#cbd5e1;
  margin-top:3px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-actions button{
  border:0;
  border-radius:8px;
  padding:9px 13px;
  background:#334155;
  color:white;
}

.header-actions button:hover{
  background:#475569;
}

/* =========================
   MAIN
========================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);
  font-size:14px;
}

.stat-value{
  font-size:28px;
  font-weight:bold;
  margin-top:6px;
}

/* =========================
   CARDS
========================= */

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}

.card h2{
  margin:0 0 16px;
  font-size:20px;
}

.card h3{
  margin:0 0 12px;
}

/* =========================
   FORM
========================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field{
  display:flex;
  flex-direction:column;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
  background:white;
}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--primary);
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  font-weight:bold;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-primary:hover{
  background:var(--primary-dark);
}

.btn-secondary{
  background:#eef2f6;
  color:#344054;
}

.btn-green{
  background:#dcfce7;
  color:#166534;
}

.btn-red{
  background:#fee2e2;
  color:#991b1b;
}

/* =========================
   SEARCH
========================= */

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.search-box{
  flex:1;
  min-width:250px;
}

.search-box input{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:9px;
}

.filter-btn{
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:9px;
  background:white;
}

.filter-btn.active{
  background:var(--primary);
  color:white;
  border-color:var(--primary);
}

/* =========================
   SUPPLIERS
========================= */

.supplier-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.supplier-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
}

.supplier-name{
  font-weight:bold;
  font-size:17px;
  margin-bottom:8px;
}

.supplier-info{
  font-size:13px;
  color:var(--muted);
  line-height:1.6;
}

/* =========================
   TABLE
========================= */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,
td{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  vertical-align:top;
}

th{
  background:#f8fafc;
  font-size:13px;
}

td{
  font-size:14px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.status.waiting{
  background:#fef3c7;
  color:#92400e;
}

.status.arrived{
  background:#dcfce7;
  color:#166534;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.actions button{
  border:0;
  border-radius:7px;
  padding:7px 9px;
  font-size:12px;
  font-weight:bold;
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

/* =========================
   MESSAGE
========================= */

.message{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:100;
  max-width:350px;
  padding:13px 16px;
  border-radius:10px;
  color:white;
  background:#17202a;
  box-shadow:var(--shadow);
  display:none;
}

.message.success{
  background:var(--green);
}

.message.error{
  background:var(--red);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .supplier-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){

  .header-inner{
    align-items:flex-start;
  }

  .header-actions{
    flex-direction:column;
  }

  .header-actions button{
    padding:7px 10px;
  }

  .container{
    padding:12px;
  }

  .card{
    padding:15px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:13px;
  }

  .stat-value{
    font-size:23px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .supplier-grid{
    grid-template-columns:1fr;
  }

  .form-actions{
    flex-direction:column;
  }

  .form-actions button{
    width:100%;
  }

  .login-buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <h1>📦 Porositë</h1>

    <p>
      Hyr në llogarinë tënde për të menaxhuar porositë.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Fjalëkalimi"
      autocomplete="current-password"
    >

    <div class="login-buttons">

      <button onclick="login()">
        Hyr
      </button>

      <button onclick="register()">
        Krijo llogari
      </button>

    </div>

    <div id="loginMessage" class="login-message"></div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="appShell" class="hidden">

<header>

  <div class="header-inner">

    <div>
      <div class="header-title">
        📦 Porositë
      </div>

      <div class="header-subtitle">
        Menaxhimi i porosive dhe furnitorëve
      </div>
    </div>

    <div class="header-actions">

      <button onclick="loadAll()">
        ↻ Rifresko
      </button>

      <button onclick="logout()">
        Dil
      </button>

    </div>

  </div>

</header>


<main class="container">

  <!-- =========================
       STATS
  ========================= -->

  <div class="stats">

    <div class="stat">
      <div class="stat-label">
        Porosi në pritje
      </div>

      <div id="waitingCount" class="stat-value">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        Porosi të ardhura
      </div>

      <div id="arrivedCount" class="stat-value">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        Gjithsej porosi
      </div>

      <div id="totalCount" class="stat-value">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">
        Furnitorë
      </div>

      <div id="supplierCount" class="stat-value">
        0
      </div>
    </div>

  </div>


  <!-- =========================
       ADD ORDER
  ========================= -->

  <div class="card">

    <h2>
      ➕ Shto porosi
    </h2>

    <div class="form-grid">

      <div class="field">

        <label>
          Furnitori *
        </label>

        <select id="supplier">

          <option value="">
            Zgjidh furnitorin...
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Produkti *
        </label>

        <input
          id="product"
          type="text"
          placeholder="Shkruaj produktin..."
        >

      </div>


      <div class="field">

        <label>
          Sasia
        </label>

        <input
          id="quantity"
          type="text"
          placeholder="p.sh. 5"
        >

      </div>


      <div class="field">

        <label>
          Njësia
        </label>

        <input
          id="unit"
          type="text"
          placeholder="cope, pako, metra..."
        >

      </div>


      <div class="field full">

        <label>
          Specifikimi
        </label>

        <input
          id="specification"
          type="text"
          placeholder="p.sh. 50 cm, zi, 70 cm lartësi..."
        >

      </div>


      <div class="field full">

        <label>
          Shënim
        </label>

        <textarea
          id="note"
          placeholder="Shënim shtesë..."
        ></textarea>

      </div>

    </div>


    <div class="form-actions">

      <button
        class="btn btn-primary"
        onclick="saveOrder()"
      >
        + Ruaj porosinë
      </button>

      <button
        class="btn btn-secondary"
        onclick="clearOrderForm()"
      >
        Pastro
      </button>

    </div>

  </div>


  <!-- =========================
       SUPPLIERS
  ========================= -->

  <div class="card">

    <h2>
      🏢 Furnitorët
    </h2>

    <div
      id="supplierList"
      class="supplier-grid"
    ></div>

  </div>


  <!-- =========================
       ORDERS
  ========================= -->

  <div class="card">

    <h2>
      📋 Lista e porosive
    </h2>


    <div class="filters">

      <div class="search-box">

        <input
          id="search"
          type="text"
          placeholder="Kërko sipas furnitorit, produktit ose specifikimit..."
          oninput="renderOrders()"
        >

      </div>


      <button
        id="filterAll"
        class="filter-btn active"
        onclick="setFilter('all')"
      >
        Të gjitha
      </button>

      <button
        id="filterWaiting"
        class="filter-btn"
        onclick="setFilter('waiting')"
      >
        Në pritje
      </button>

      <button
        id="filterArrived"
        class="filter-btn"
        onclick="setFilter('arrived')"
      >
        Të ardhura
      </button>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              Furnitori
            </th>

            <th>
              Produkti
            </th>

            <th>
              Sasia
            </th>

            <th>
              Specifikimi
            </th>

            <th>
              Data
            </th>

            <th>
              Statusi
            </th>

            <th>
              Veprime
            </th>

          </tr>

        </thead>

        <tbody id="ordersTable"></tbody>

      </table>

    </div>

  </div>

</main>

</div>


<div id="message" class="message"></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://sfddbealvlrlvqawfcem.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_uSRoEKBFo1Q9zJptUpO9Ww_oiYZE9Cr";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   STATE
========================================= */

let currentUser = null;

let suppliers = [];

let orders = [];

let currentFilter = "all";


/* =========================================
   ELEMENTS
========================================= */

const loginScreen =
  document.getElementById("loginScreen");

const appShell =
  document.getElementById("appShell");

const loginMessage =
  document.getElementById("loginMessage");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type = ""){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className = "message " + type;

  box.style.display = "block";

  setTimeout(() => {

    box.style.display = "none";

  }, 3000);
}


/* =========================================
   LOGIN MESSAGE
========================================= */

function showLoginMessage(text){

  loginMessage.textContent = text;

  loginMessage.style.display = "block";
}


/* =========================================
   SHOW / HIDE
========================================= */

function showLogin(){

  loginScreen.classList.remove("hidden");

  appShell.classList.add("hidden");

}


function showApp(){

  loginScreen.classList.add("hidden");

  appShell.classList.remove("hidden");

}


/* =========================================
   REGISTER
========================================= */

async function register(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    showLoginMessage(
      "Shkruaj emailin dhe fjalëkalimin."
    );

    return;
  }

  if(password.length < 6){

    showLoginMessage(
      "Fjalëkalimi duhet të ketë së paku 6 karaktere."
    );

    return;
  }

  const { data, error } =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if(error){

    showLoginMessage(error.message);

    return;
  }

  if(data.session){

    currentUser = data.user;

    showApp();

    await loadAll();

    showMessage(
      "Llogaria u krijua me sukses.",
      "success"
    );

  }else{

    showLoginMessage(
      "Llogaria u krijua. Kontrollo emailin për konfirmim nëse kërkohet."
    );

  }

}


/* =========================================
   LOGIN
========================================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    showLoginMessage(
      "Shkruaj emailin dhe fjalëkalimin."
    );

    return;
  }

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    showLoginMessage(error.message);

    return;
  }

  currentUser = data.user;

  showApp();

  await loadAll();

  showMessage(
    "U kyçe me sukses.",
    "success"
  );

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  orders = [];

  suppliers = [];

  showLogin();

}


/* =========================================
   SESSION
========================================= */

async function checkSession(){

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();

  if(session){

    currentUser = session.user;

    showApp();

    await loadAll();

  }else{

    showLogin();

  }

}


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if(session){

      currentUser = session.user;

      showApp();

      await loadAll();

    }else{

      currentUser = null;

      showLogin();

    }

  }
);


/* =========================================
   LOAD ALL
========================================= */

async function loadAll(){

  if(!currentUser){

    return;
  }

  await loadSuppliers();

  await loadOrders();

  renderAll();

}


/* =========================================
   LOAD SUPPLIERS
========================================= */

async function loadSuppliers(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("suppliers")
    .select("id,name,user_id")
    .eq("user_id", currentUser.id)
    .order("name", {
      ascending:true
    });

  if(error){

    console.error(error);

    showMessage(
      "Gabim gjatë leximit të furnitorëve.",
      "error"
    );

    return;
  }

  suppliers = data || [];

  document.getElementById(
    "supplierCount"
  ).textContent = suppliers.length;

  renderSupplierSelect();

  renderSuppliers();

}


/* =========================================
   SUPPLIER SELECT
========================================= */

function renderSupplierSelect(){

  const select =
    document.getElementById("supplier");

  select.innerHTML =
    `<option value="">
      Zgjidh furnitorin...
    </option>`;

  suppliers.forEach(supplier => {

    const option =
      document.createElement("option");

    option.value = supplier.id;

    option.textContent = supplier.name;

    select.appendChild(option);

  });

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("orders")
    .select(`
      id,
      supplier_id,
      product_id,
      product_name,
      quantity,
      unit,
      specification,
      note,
      order_date,
      status,
      arrived_date,
      created_at,
      user_id,
      suppliers(name)
    `)
    .eq("user_id", currentUser.id)
    .order("created_at", {
      ascending:false
    });

  if(error){

    console.error(error);

    showMessage(
      "Gabim gjatë leximit të porosive.",
      "error"
    );

    return;
  }

  orders = data || [];

  renderStats();

  renderOrders();

}


/* =========================================
   SAVE ORDER
========================================= */

async function saveOrder(){

  if(!currentUser){

    showMessage(
      "Duhet të jesh i kyçur.",
      "error"
    );

    return;
  }

  const supplierId =
    document.getElementById("supplier").value;

  const product =
    document.getElementById("product").value.trim();

  const quantity =
    document.getElementById("quantity").value.trim();

  const unit =
    document.getElementById("unit").value.trim();

  const specification =
    document.getElementById("specification").value.trim();

  const note =
    document.getElementById("note").value.trim();


  if(!supplierId){

    showMessage(
      "Zgjidh furnitorin.",
      "error"
    );

    return;
  }


  if(!product){

    showMessage(
      "Shkruaj produktin.",
      "error"
    );

    return;
  }


  const orderData = {

    supplier_id: supplierId,

    product_id: null,

    product_name: product,

    quantity: quantity || null,

    unit: unit || null,

    specification:
      specification || null,

    note:
      note || null,

    order_date:
      new Date().toISOString().slice(0,10),

    status:"waiting",

    user_id:
      currentUser.id

  };


  const {
    error
  } =
  await supabaseClient
    .from("orders")
    .insert(orderData);


  if(error){

    console.error(error);

    showMessage(
      "Gabim gjatë ruajtjes: " + error.message,
      "error"
    );

    return;
  }


  clearOrderForm();

  await loadOrders();

  renderStats();

  showMessage(
    "Porosia u ruajt me sukses.",
    "success"
  );

}


/* =========================================
   CLEAR FORM
========================================= */

function clearOrderForm(){

  document.getElementById("supplier").value = "";

  document.getElementById("product").value = "";

  document.getElementById("quantity").value = "";

  document.getElementById("unit").value = "";

  document.getElementById("specification").value = "";

  document.getElementById("note").value = "";

}


/* =========================================
   CHANGE STATUS
========================================= */

async function toggleStatus(id, status){

  const newStatus =
    status === "waiting"
      ? "arrived"
      : "waiting";


  const updateData = {

    status:newStatus

  };


  if(newStatus === "arrived"){

    updateData.arrived_date =
      new Date().toISOString();

  }else{

    updateData.arrived_date = null;

  }


  const {
    error
  } =
  await supabaseClient
    .from("orders")
    .update(updateData)
    .eq("id", id)
    .eq("user_id", currentUser.id);


  if(error){

    console.error(error);

    showMessage(
      "Gabim gjatë ndryshimit të statusit.",
      "error"
    );

    return;
  }


  await loadOrders();

  renderStats();

  showMessage(
    newStatus === "arrived"
      ? "Porosia u shënua si e ardhur."
      : "Porosia u kthye në pritje.",
    "success"
  );

}


/* =========================================
   DELETE ORDER
========================================= */

async function deleteOrder(id){

  const confirmed =
    confirm(
      "A je i sigurt që dëshiron ta fshish këtë porosi?"
    );

  if(!confirmed){

    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("orders")
    .delete()
    .eq("id", id)
    .eq("user_id", currentUser.id);


  if(error){

    console.error(error);

    showMessage(
      "Gabim gjatë fshirjes.",
      "error"
    );

    return;
  }


  await loadOrders();

  renderStats();

  showMessage(
    "Porosia u fshi.",
    "success"
  );

}


/* =========================================
   FILTER
========================================= */

function setFilter(filter){

  currentFilter = filter;

  document
    .getElementById("filterAll")
    .classList.remove("active");

  document
    .getElementById("filterWaiting")
    .classList.remove("active");

  document
    .getElementById("filterArrived")
    .classList.remove("active");


  if(filter === "all"){

    document
      .getElementById("filterAll")
      .classList.add("active");

  }

  if(filter === "waiting"){

    document
      .getElementById("filterWaiting")
      .classList.add("active");

  }

  if(filter === "arrived"){

    document
      .getElementById("filterArrived")
      .classList.add("active");

  }


  renderOrders();

}


/* =========================================
   RENDER STATS
========================================= */

function renderStats(){

  const waiting =
    orders.filter(
      order => order.status === "waiting"
    ).length;


  const arrived =
    orders.filter(
      order => order.status === "arrived"
    ).length;


  document.getElementById(
    "waitingCount"
  ).textContent = waiting;


  document.getElementById(
    "arrivedCount"
  ).textContent = arrived;


  document.getElementById(
    "totalCount"
  ).textContent = orders.length;


  document.getElementById(
    "supplierCount"
  ).textContent = suppliers.length;

}


/* =========================================
   RENDER SUPPLIERS
========================================= */

function renderSuppliers(){

  const box =
    document.getElementById("supplierList");

  if(!suppliers.length){

    box.innerHTML =
      `<div class="empty">
        Nuk ka furnitorë.
      </div>`;

    return;
  }


  box.innerHTML = "";


  suppliers.forEach(supplier => {

    const supplierOrders =
      orders.filter(
        order =>
          String(order.supplier_id) ===
          String(supplier.id)
      );


    const waiting =
      supplierOrders.filter(
        order =>
          order.status === "waiting"
      ).length;


    const arrived =
      supplierOrders.filter(
        order =>
          order.status === "arrived"
      ).length;


    const card =
      document.createElement("div");

    card.className = "supplier-card";


    card.innerHTML = `

      <div class="supplier-name">
        ${escapeHtml(supplier.name)}
      </div>

      <div class="supplier-info">

        ${waiting} në pritje<br>

        ${arrived} të ardhura<br>

        Gjithsej:
        ${supplierOrders.length} porosi

      </div>

    `;


    box.appendChild(card);

  });

}


/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(){

  const tbody =
    document.getElementById("ordersTable");


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  let filtered =
    [...orders];


  if(currentFilter !== "all"){

    filtered =
      filtered.filter(
        order =>
          order.status === currentFilter
      );

  }


  if(search){

    filtered =
      filtered.filter(order => {

        const supplierName =
          order.suppliers?.name || "";

        const product =
          order.product_name || "";

        const specification =
          order.specification || "";

        const note =
          order.note || "";


        const text = (

          supplierName +
          " " +
          product +
          " " +
          specification +
          " " +
          note

        ).toLowerCase();


        return text.includes(search);

      });

  }


  if(!filtered.length){

    tbody.innerHTML = `

      <tr>

        <td colspan="7">

          <div class="empty">
            Nuk ka porosi.
          </div>

        </td>

      </tr>

    `;

    return;
  }


  tbody.innerHTML = "";


  filtered.forEach(order => {

    const tr =
      document.createElement("tr");


    const supplierName =
      order.suppliers?.name ||
      "Pa furnitor";


    const date =
      order.order_date
        ? formatDate(order.order_date)
        : "-";


    const statusHtml =
      order.status === "waiting"

        ? `<span class="status waiting">
             Në pritje
           </span>`

        : `<span class="status arrived">
             Të ardhura
           </span>`;


    const actionText =
      order.status === "waiting"
        ? "✓ Erdhi"
        : "↩ Pritje";


    const actionClass =
      order.status === "waiting"
        ? "btn-green"
        : "btn-secondary";


    tr.innerHTML = `

      <td>
        <strong>
          ${escapeHtml(supplierName)}
        </strong>
      </td>

      <td>

        <strong>
          ${escapeHtml(order.product_name || "-")}
        </strong>

        ${
          order.note
            ? `<div style="
                 color:#667085;
                 font-size:12px;
                 margin-top:4px;
               ">
                 ${escapeHtml(order.note)}
               </div>`
            : ""
        }

      </td>

      <td>

        ${escapeHtml(
          order.quantity || "-"
        )}

        ${
          order.unit
            ? " " + escapeHtml(order.unit)
            : ""
        }

      </td>

      <td>
        ${escapeHtml(
          order.specification || "-"
        )}
      </td>

      <td>
        ${date}
      </td>

      <td>
        ${statusHtml}
      </td>

      <td>

        <div class="actions">

          <button
            class="${actionClass}"
            onclick="toggleStatus(
              ${order.id},
              '${order.status}'
            )"
          >
            ${actionText}
          </button>

          <button
            class="btn-red"
            onclick="deleteOrder(${order.id})"
          >
            Fshi
          </button>

        </div>

      </td>

    `;


    tbody.appendChild(tr);

  });

}


/* =========================================
   RENDER ALL
========================================= */

function renderAll(){

  renderStats();

  renderSuppliers();

  renderOrders();

}


/* =========================================
   DATE
========================================= */

function formatDate(dateString){

  const date =
    new Date(
      dateString + "T00:00:00"
    );


  return date.toLocaleDateString(
    "sq-AL",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
